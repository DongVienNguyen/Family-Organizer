name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows Node${{ matrix.major }} baseline
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 22
            node: '22.23.3'
            npm: '10.9.9'
          - major: 24
            node: '24.21.0'
            npm: '11.19.0'
    env:
      CI: 'true'
      TZ: Asia/Saigon
      EXPECTED_NODE: ${{ matrix.node }}
      EXPECTED_NPM: ${{ matrix.npm }}
      EXPECTED_VS: '17.14.37710.0'
      EXPECTED_SQLITE_ADDON: '13.0.3'
      TEST_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
          package-manager-cache: false
      - name: Resolve npm cache directory
        id: npm-cache
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $PSNativeCommandUseErrorActionPreference = $false
          $cachePath = & npm.cmd config get cache
          $cacheCode = $LASTEXITCODE
          if ($cacheCode -ne 0) { exit $cacheCode }
          "cache-path=$($cachePath.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.npm-cache.outputs.cache-path }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-npm${{ matrix.npm }}-${{ hashFiles('package-lock.json') }}
      - name: Install from lockfile
        id: install
        run: ./scripts/ci/Invoke-Check.ps1 -Check install
      - name: Windows PowerShell release verifier rejects missing evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $PSNativeCommandUseErrorActionPreference = $false
          $missing = Join-Path $env:RUNNER_TEMP ('missing-release-evidence-' + [guid]::NewGuid() + '.json')
          & powershell.exe -NoProfile -File ./scripts/windows/Test-ReleaseEvidence.ps1 -EvidenceFile $missing
          $nativeCode = $LASTEXITCODE
          @{ commitSha = $env:TEST_COMMIT_SHA; phase = 'release-evidence-missing-refusal'; expectedExitCode = 1; actualExitCode = $nativeCode } | ConvertTo-Json | Set-Content reports/release-policy-native.json
          if ($nativeCode -ne 1) { throw 'Release evidence verifier did not propagate native refusal' }
      - name: Dependency advisory audit
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci/Test-Audit.ps1
      - name: Native SQLite compatibility
        id: native
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci/Invoke-Check.ps1 -Check native
      - name: TypeScript check
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci/Invoke-Check.ps1 -Check lint
      - name: Unit and SQLite regression tests
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci/Invoke-Check.ps1 -Check test
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci/Invoke-Check.ps1 -Check build
      - name: Validate measured coverage ratchets
        id: coverage
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: ./scripts/ci/Test-Coverage.ps1
      - name: Production layout from System32 and denied-write startup
        id: production
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/ci/Test-Production.ps1
      - name: Validate and record evidence
        if: ${{ always() }}
        env:
          CHECK_INSTALL: ${{ steps.install.outcome }}
          CHECK_AUDIT: ${{ steps.audit.outcome }}
          CHECK_NATIVE: ${{ steps.native.outcome }}
          CHECK_LINT: ${{ steps.lint.outcome }}
          CHECK_TEST: ${{ steps.test.outcome }}
          CHECK_COVERAGE: ${{ steps.coverage.outcome }}
          CHECK_BUILD: ${{ steps.build.outcome }}
          CHECK_PRODUCTION: ${{ steps.production.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          node scripts/ci/write-evidence.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: windows-node${{ matrix.major }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Windows production browsers
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CI: 'true'
      TZ: Asia/Saigon
      EXPECTED_NODE: '24.21.0'
      EXPECTED_NPM: '11.19.0'
      EXPECTED_VS: '17.14.37710.0'
      EXPECTED_SQLITE_ADDON: '13.0.3'
      TEST_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
          architecture: x64
          package-manager-cache: false
      - name: Resolve npm cache directory
        id: npm-cache
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $PSNativeCommandUseErrorActionPreference = $false
          $cachePath = & npm.cmd config get cache
          $cacheCode = $LASTEXITCODE
          if ($cacheCode -ne 0) { exit $cacheCode }
          "cache-path=$($cachePath.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.npm-cache.outputs.cache-path }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node24.21.0-npm11.19.0-${{ hashFiles('package-lock.json') }}
      - name: Install from lockfile
        id: install
        run: ./scripts/ci/Invoke-Check.ps1 -Check install
      - name: Native SQLite compatibility
        id: native
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci/Invoke-Check.ps1 -Check native
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ./scripts/ci/Invoke-Check.ps1 -Check build
      - name: Offline browser regression
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.native.outcome == 'success' }}
        run: ./scripts/ci/Test-Browser.ps1
      - name: Validate browser evidence
        if: ${{ always() }}
        env:
          CHECK_INSTALL: ${{ steps.install.outcome }}
          CHECK_NATIVE: ${{ steps.native.outcome }}
          CHECK_BUILD: ${{ steps.build.outcome }}
          CHECK_BROWSER: ${{ steps.browser.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          node scripts/ci/write-browser-evidence.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: windows-browsers-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: reports/
          # Only synthetic reports; include Playwright's declared .last-run.json.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  package-build:
    name: Windows package producer
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPECTED_NODE: '24.21.0'
      EXPECTED_NPM: '11.19.0'
      TEST_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
          architecture: x64
          package-manager-cache: false
      - name: Install and build
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Path reports/package-build -Force | Out-Null
          & npm.cmd ci --foreground-scripts 2>&1 | Tee-Object reports/package-build/install.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          & npm.cmd run build 2>&1 | Tee-Object reports/package-build/build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Verify installer preflight with Windows PowerShell 5.1
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -File scripts/windows/Test-Archive.ps1 -ReportPath reports/package-build/archive-contract.json
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Parse native scripts with Windows PowerShell 5.1
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -NonInteractive -File scripts/windows/Test-NativeSyntax.ps1 -ReportPath reports/package-build/native-syntax.json
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Verify producer refusal and cleanup evidence
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $PSNativeCommandUseErrorActionPreference = $false
          & powershell.exe -NoProfile -File scripts/windows/Build-Package.ps1 -CommitSha ('0' * 40) -OutputDirectory reports/package-build/negative-producer 2>&1 | Tee-Object reports/package-build/producer-refusal.log
          $refusalCode = $LASTEXITCODE
          if ($refusalCode -ne 1) { throw "Expected source refusal exit1, received $refusalCode" }
          $report = Get-Content reports/package-build/negative-producer/producer-exit.json -Raw | ConvertFrom-Json
          if ($report.exitCode -ne 1 -or $report.nativeExitCodes.git -ne 0 -or !$report.fixtureCleanup -or $report.failure -notmatch 'source SHA mismatch' -or (Test-Path reports/package-build/negative-producer/family-organizer-win-x64.zip)) {
            throw 'Producer failure/native/cleanup evidence rejected'
          }
          # The native exit1 is expected only after all refusal assertions above pass.
          exit 0
      - name: Build verified Windows ZIP
        run: ./scripts/windows/Build-Package.ps1 -CommitSha $env:TEST_COMMIT_SHA -OutputDirectory reports/package-build
      - name: Prepare independent consumer harness
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path reports/package-harness -Force | Out-Null
          Copy-Item scripts/windows/Archive.ps1, scripts/windows/Test-Package.ps1, scripts/windows/verify-package.mjs, scripts/windows/package-files.mjs, scripts/windows/package-contract.mjs, scripts/windows/license-policy.mjs, scripts/windows/license-inventory.mjs, scripts/windows/reviewed-notices.mjs, scripts/windows/service-config.mjs, scripts/windows/Test-Service.ps1, scripts/windows/Test-ServiceSecurity.ps1, scripts/windows/probe-service.mjs, scripts/windows/probe-credential-service.mjs, scripts/windows/probe-scheduled-service.mjs, scripts/windows/probe-update-service.mjs, scripts/windows/probe-update-coordinator.mjs, scripts/windows/probe-recovery.mjs, scripts/windows/probe-private-settings.mjs,scripts/windows/probe-signing-key.mjs, scripts/windows/probe-provider-env.mjs, scripts/windows/probe-online-recovery.mjs, scripts/windows/probe-online-recovery-child.cjs, scripts/windows/probe-recovery-service.mjs, scripts/windows/probe-package-functional.mjs reports/package-harness
          Copy-Item scripts/ci/probe-production.mjs, scripts/ci/probe-first-account.mjs, scripts/ci/probe-schema-compatibility.mjs, scripts/ci/block-network.cjs, scripts/ci/digest-fixture.cjs reports/package-harness
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: windows-package-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: reports/package-build/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-package-harness-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: reports/package-harness/
          if-no-files-found: error
          retention-days: 14

  package-test:
    name: Windows package clean consumer
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [package-build]
    env:
      CI: 'true'
      TEST_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-package-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-package-harness-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-harness
      - name: Validate and exercise the downloaded ZIP without checkout or rebuild
        run: '& "$env:RUNNER_TEMP/package-harness/Test-Package.ps1" -ArtifactDirectory "$env:RUNNER_TEMP/package-artifact" -CommitSha $env:TEST_COMMIT_SHA -ReportDirectory "$env:RUNNER_TEMP/package-reports"'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: windows-package-tests-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-reports/
          if-no-files-found: error
          retention-days: 14

  service-test:
    name: Windows disposable service
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [package-build, package-test]
    env:
      CI: 'true'
      TEST_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-package-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-package-harness-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-harness
      - name: Verify early service failure produces typed cleanup evidence
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $PSNativeCommandUseErrorActionPreference = $false
          $negative = "$env:RUNNER_TEMP/service-reports/early-refusal"
          & powershell.exe -NoProfile -NonInteractive -File "$env:RUNNER_TEMP/service-harness/Test-Service.ps1" -ArtifactDirectory "$env:RUNNER_TEMP/service-artifact" -CommitSha ('0' * 40) -ReportDirectory $negative 2>&1 | Tee-Object "$env:RUNNER_TEMP/service-refusal.log"
          $code = $LASTEXITCODE
          if ($code -ne 1) { throw "Expected source refusal exit1, received $code" }
          $report = Get-Content "$negative/service-exit.json" -Raw | ConvertFrom-Json
          if ($report.commitSha -cne ('0' * 40) -or $report.exitCode -ne 1 -or !$report.fixtureCleanup -or !$report.serviceRemoved -or $report.failure -notmatch 'Service package source/producer proof rejected' -or @($report.nativeExitCodes).Count -ne 0 -or @($report.preflightNativeExitCodes).Count -ne 0) { throw 'Early service failure report rejected' }
          Copy-Item "$env:RUNNER_TEMP/service-refusal.log" "$negative/refusal.log"
          exit 0
      - name: Verify actual service on disposable Windows without checkout or rebuild
        run: '& "$env:RUNNER_TEMP/service-harness/Test-Service.ps1" -ArtifactDirectory "$env:RUNNER_TEMP/service-artifact" -CommitSha $env:TEST_COMMIT_SHA -ReportDirectory "$env:RUNNER_TEMP/service-reports"'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: windows-service-tests-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-reports/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    runs-on: windows-2022
    timeout-minutes: 5
    needs: [quality, browser, package-build, package-test, service-test]
    if: ${{ always() }}
    steps:
      - name: Require Windows quality, browser, package and service checks to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          PACKAGE_BUILD_RESULT: ${{ needs.package-build.result }}
          PACKAGE_TEST_RESULT: ${{ needs.package-test.result }}
          SERVICE_TEST_RESULT: ${{ needs.service-test.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:QUALITY_RESULT -ne 'success') {
            throw "Windows baseline matrix result: $env:QUALITY_RESULT"
          }
          if ($env:BROWSER_RESULT -ne 'success') {
            throw "Windows browser result: $env:BROWSER_RESULT"
          }
          if ($env:PACKAGE_BUILD_RESULT -ne 'success' -or $env:PACKAGE_TEST_RESULT -ne 'success') {
            throw "Windows package producer/consumer failed: $env:PACKAGE_BUILD_RESULT/$env:PACKAGE_TEST_RESULT"
          }
          if ($env:SERVICE_TEST_RESULT -ne 'success') {
            throw "Windows disposable service failed: $env:SERVICE_TEST_RESULT"
          }
